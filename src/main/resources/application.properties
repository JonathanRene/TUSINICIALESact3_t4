spring.application.name=act3_t4

# Puerto local para no chocar con tus actividades anteriores
server.port=8085

# Configuración de la base de datos MySQL (Local - XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/bd_escuela_act3?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate (Para que cree las tablas automáticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect